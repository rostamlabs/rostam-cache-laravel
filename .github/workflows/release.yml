name: release

on:
  push:
    tags: ['v*']

# Nothing here writes unless it has to. Only the last job, which runs no
# third-party action, is given the token that can publish.
permissions:
  contents: read

# One run per tag at a time, and never cancelled halfway: two runs for the same
# tag would both find no release and both try to create it.
concurrency:
  group: release-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: refuse a tag that is not a version on main
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # The tag name is data from whoever pushed it, so it reaches the shell as
      # an environment variable and is checked before anything else uses it.
      #
      # Only what Composer reads as a release: vX.Y.Z, optionally with one of
      # its stability suffixes. A tag it cannot parse - v0.3.0-next.1 - would
      # pass every gate here, get a GitHub release, and never reach Packagist.
      # -dev is refused too, since Composer reads it as a branch, not a release.
      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|RC|rc|a|b|p|pl|patch)\.?[0-9]*)?$'; then
            echo "::error::not a version tag Composer reads as a release: $TAG"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$TAG points at a commit that is not on main"
            exit 1
          fi

  # A tag is the one moment a mistake becomes permanent: Packagist reads the
  # tag, and a released version cannot be taken back, only superseded. So the
  # whole test workflow runs again here, on the tagged commit - every matrix
  # entry and the real servers - rather than trusting that it ran before.
  verify:
    name: verify
    needs: guard
    uses: ./.github/workflows/tests.yml

  manifest:
    name: validate the manifest
    needs: guard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none

      - run: composer validate --strict

  publish:
    name: publish
    needs: [verify, manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # What was verified is the commit this run started on. A tag moved
          # while the gates ran points somewhere nothing checked.
          if [ "$(git rev-parse "$TAG^{commit}")" != "$SHA" ]; then
            echo "::error::$TAG moved while it was being verified; push it again to re-run"
            exit 1
          fi

          # alpha, beta and RC are pre-releases to Composer; a patch suffix is not.
          prerelease=false
          if printf '%s' "$TAG" | grep -Eq -- '-(alpha|beta|RC|rc|a|b)\.?[0-9]*$'; then
            prerelease=true
          fi

          # The notes run from the highest version tag this one descends from -
          # by ancestry, so a tag on another line cannot empty them - and, for a
          # stable release, the highest STABLE one, so they cover everything
          # since the last release people installed rather than since its RC.
          # The suffixes are listed in the order Composer ranks them - alpha,
          # beta, RC, then the release - so v0.3.0-RC1 sorts above -beta2 and
          # below v0.3.0; a patch suffix is not listed and sorts above its base.
          previous=''
          for candidate in $(git -c versionsort.suffix=-alpha -c versionsort.suffix=-a -c versionsort.suffix=-beta -c versionsort.suffix=-b -c versionsort.suffix=-RC -c versionsort.suffix=-rc tag --merged "$TAG^" --list 'v[0-9]*' --sort=-version:refname 2>/dev/null || true); do
            if [ "$prerelease" = false ] && printf '%s' "$candidate" | grep -Eq -- '-(alpha|beta|RC|rc|a|b)\.?[0-9]*$'; then
              continue
            fi
            previous=$candidate
            break
          done
          if [ -n "$previous" ]; then
            notes=$(git log --no-merges --pretty='- %s' "$previous..$TAG")
            body=$(printf '## Changes since %s\n\n%s' "$previous" "$notes")
          else
            body='First release.'
          fi
          # Create or reconcile, never fail on "it already exists". A tag can be
          # re-pushed - moved onto a later commit before anyone has installed it,
          # or retried after a transient failure - and when that happens the gates
          # above are exactly what should run again. Refusing at the last step
          # turns a green verification into a red run, which teaches everyone to
          # ignore this workflow.
          action=create
          if gh release view "$TAG" >/dev/null 2>&1; then
            action=edit
          fi

          gh release "$action" "$TAG" \
            --title "$TAG" \
            --notes "$body" \
            --prerelease="$prerelease" \
            --verify-tag
