name: tests

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs this whole file again, on the tagged commit.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style:
    name: formatting
    runs-on: ubuntu-latest

    # Once, not per matrix entry. Pint's own rules move between releases, so
    # asking the oldest allowed Pint to agree with the newest about the same
    # file is a question with no answer rather than a finding.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # 3.2.1

      - run: vendor/bin/pint --test

  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    # A cache driver lives or dies by the framework contract it implements, and
    # that contract moves. The matrix is the framework versions the manifest
    # claims, on the PHP versions each of them supports.
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['12.*', '13.*']
        exclude:
          # Laravel 13 requires PHP 8.3. The pair does not exist, so asking for
          # it is not a gap in coverage - it is a job that can only ever fail.
          - php: '8.2'
            laravel: '13.*'
        include:
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Pin the framework for this run
        run: >
          composer require --no-update --no-interaction --dev
          "laravel/framework:${{ matrix.laravel }}"
          "orchestra/testbench:${{ matrix.testbench }}"

      - name: Install dependencies
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # 3.2.1

      - name: Run the suite
        run: vendor/bin/phpunit

  conformance:
    name: conformance against rostam-server (${{ matrix.channel }})
    runs-on: ubuntu-latest

    # The suite's default target is a fake server written in PHP. A fake is a
    # reimplementation of the protocol by the same hand that wrote the client,
    # so a shared misreading of the wire would pass every test here and still
    # fail in production. This lane talks to the real binary instead - it is
    # what caught the store swallowing a framing error as "this key is not a
    # counter", and the tag ids that a real evicting cache drops.
    #
    # Twice. GitHub's releases/latest skips pre-releases, so it answers the stable
    # server people run today - and a lane that only ever saw that one would
    # never meet what a beta changed. The pre-release lane takes the highest
    # version of any kind, by version rather than date.
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, prerelease]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # 3.2.1

      - name: Fetch rostam-server (${{ matrix.channel }})
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ matrix.channel }}
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/rostamlabs/rostam/releases?per_page=50" -o releases.json

          # The HIGHEST version, not the newest by date. Picking by date, a patch
          # published after a beta would hand the pre-release lane a stable
          # server, and the lane would quietly test nothing new. Stable takes the
          # highest release that is not a pre-release.
          url=$(php -r '
            $best = null;
            foreach (json_decode(file_get_contents("releases.json"), true) as $release) {
                if ($release["draft"] || (getenv("CHANNEL") === "stable" && $release["prerelease"])) {
                    continue;
                }
                foreach ($release["assets"] as $asset) {
                    if (str_ends_with($asset["name"], "linux_amd64.tar.gz")
                        && ($best === null || version_compare(ltrim($release["tag_name"], "v"), ltrim($best[0], "v"), ">"))) {
                        $best = [$release["tag_name"], $asset["browser_download_url"]];
                    }
                }
            }
            if ($best === null) { fwrite(STDERR, "no linux_amd64 release to test against\n"); exit(1); }
            echo $best[1];
          ')
          echo "downloading $url"
          curl -fsSL "$url" -o rostam.tar.gz
          tar xzf rostam.tar.gz

          # "rostam-server 0.7.0-beta6 (go1.26.5 linux/amd64)" -> 0.7.0-beta6.
          # A version that does not read as one fails the job rather than being
          # exported garbled to the suite.
          version=$(./rostam-server --version | awk '{print $2}')
          if ! printf '%s' "$version" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::could not read a version from: $(./rostam-server --version)"
            exit 1
          fi
          echo "rostam-server $version"
          echo "ROSTAM_TEST_SERVER_VERSION=$version" >> "$GITHUB_ENV"

      - name: Start it on the binary TCP listener
        run: |
          set -euo pipefail
          ./rostam-server -tcp 127.0.0.1:7411 -insecure &
          for _ in $(seq 1 50); do
            if (echo > /dev/tcp/127.0.0.1/7411) 2>/dev/null; then
              echo "listening"; exit 0
            fi
            sleep 0.2
          done
          echo "the server never came up"; exit 1

      - name: Run the suite against it
        env:
          ROSTAM_TEST_SERVER: 127.0.0.1:7411
        run: vendor/bin/phpunit
